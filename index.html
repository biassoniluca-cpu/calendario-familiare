<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Famiglia">
<meta name="theme-color" content="#1E4D78">
<title>Calendario di famiglia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#17222C; --muted:#5B6976;
  --line:#D3DAE1; --accent:#1E4D78; --accent-ink:#FFFFFF; --today:#FFD84D; --today-ink:#17222C;
  --shadow:0 1px 0 rgba(23,34,44,.06), 0 6px 18px -10px rgba(23,34,44,.25);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161D; --surface:#18222B; --surface-2:#1E2933; --ink:#E5EBF0; --muted:#94A2AF;
    --line:#2A3743; --accent:#86B8E8; --accent-ink:#0C1824; --today:#FFD84D; --today-ink:#17222C;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161D; --surface:#18222B; --surface-2:#1E2933; --ink:#E5EBF0; --muted:#94A2AF;
  --line:#2A3743; --accent:#86B8E8; --accent-ink:#0C1824; --today:#FFD84D; --today-ink:#17222C;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:12px 16px 10px;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;margin:0;flex:1}
.period{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;margin:0 4px;min-width:0;flex:1}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.05rem}
.icon-btn:hover{background:var(--surface-2)}
.ghost{border:1px solid var(--line);background:var(--surface);height:40px;padding:0 14px;border-radius:12px;font-weight:600}
.views{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px;overflow-x:auto}
.views button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.people-filter{display:flex;gap:6px;align-items:center;min-width:0}
.fbtn{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.9rem}
.fbtn.on{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, var(--surface))}
.fbtn .ftxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn .fic{flex:none;color:var(--muted)}
.fclear{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700}
.fnote{font-size:.85rem;color:var(--muted);margin-bottom:12px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;font-size:inherit}
.tswitches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 5px;font-weight:600;font-size:.92rem;white-space:nowrap}
.pchip .dot{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700}
.pchip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb, var(--c) 16%, var(--surface))}
.pchip.all{padding-left:12px}
.pchip.all[aria-pressed="true"]{border-color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding:16px 16px 120px}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;color:var(--muted);font-size:.9rem;margin-bottom:14px}

/* Events */
.ev{display:grid;gap:1px;text-align:left;width:100%;border:0;border-left:5px solid var(--c);background:color-mix(in srgb, var(--c) 10%, var(--surface));border-radius:10px;padding:7px 10px;color:var(--ink)}
.ev:hover{background:color-mix(in srgb, var(--c) 18%, var(--surface))}
.ev-time{font-size:.78rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ev-title{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.ev-meta{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.ev-meta .who{display:inline-flex;align-items:center;gap:4px}
.ev-meta i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--c)}
.ev.is-deadline{border-left-style:dashed;background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 12%, var(--surface)) 0 8px, color-mix(in srgb, var(--c) 5%, var(--surface)) 8px 16px)}
.ev .rep{font-size:.75rem}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--ink);color:var(--surface)}
.badge.soon{background:#C2410C;color:#fff}

/* Week */
.day-num{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;letter-spacing:-.03em}
.empty-day{color:var(--muted);font-size:.85rem}

/* Month */
.month-wrap{overflow-x:auto}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px;color:var(--muted);font-weight:600;font-size:.82rem;text-align:center}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mcell{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:108px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;color:var(--ink);overflow:hidden}
.mcell.out{opacity:.45}
.mcell.sel{outline:2.5px solid var(--accent);outline-offset:-1px}
.mnum{font-family:var(--display);font-weight:700;font-size:1rem;width:28px;height:28px;display:grid;place-items:center;border-radius:9px}
.mcell.is-today .mnum{background:var(--today);color:var(--today-ink)}
.mev{font-size:.76rem;font-weight:600;border-radius:6px;padding:1px 5px;background:color-mix(in srgb, var(--c) 18%, var(--surface));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mev.is-deadline{border-left-style:dashed}
.more{font-size:.74rem;color:var(--muted);font-weight:600}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.wgrid .mcell{min-height:0;align-items:center;padding:6px 2px 8px}
.wgrid .mev,.wgrid .more{display:none}
.wgrid .dots{display:flex;justify-content:center;min-height:7px}
.scope{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 12px}
.scope h3{margin:0;font-family:var(--display);font-size:1.15rem}
.scope{scroll-margin-top:200px}
.scope .pchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plist .add-day{justify-self:start}
@media (max-width:700px){
  .mcell{min-height:58px;align-items:center;padding:4px 2px}
  .mev,.more{display:none}
  .dots{display:flex;justify-content:center}
}

/* Agenda */
.agenda{display:grid;gap:14px;max-width:720px}
.aday{display:grid;grid-template-columns:64px 1fr;gap:12px}
.adate{text-align:center;padding-top:2px}
.adate .day-num{display:inline-block}
.aday.is-today .day-num{background:var(--today);color:var(--today-ink);border-radius:10px;padding:2px 6px}
.adate small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.alist{display:grid;gap:6px}
.amonth{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--muted);margin:8px 0 -4px 76px}

/* People */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:16px;padding:12px;text-align:left;color:var(--ink);display:grid;gap:4px}
.pcard[aria-pressed="true"]{outline:2.5px solid var(--c);outline-offset:-1px;background:color-mix(in srgb, var(--c) 8%, var(--surface))}
.pcard b{font-family:var(--display);font-size:1.15rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.steps{margin:12px 0 14px;padding-left:22px;display:grid;gap:6px}
.pushbox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;display:grid;gap:8px}
.pushbox h3{margin:0;font-family:var(--display);font-size:1.05rem;display:flex;align-items:center;gap:8px}
.pcard small{color:var(--muted);font-weight:600}

.empty{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:520px;display:grid;gap:12px}
.empty h2{margin:0;font-family:var(--display);font-size:1.5rem;letter-spacing:-.02em}
.empty p{margin:0;color:var(--muted)}

/* FAB */
.fabbar{position:fixed;left:0;right:0;bottom:0;padding:0 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;pointer-events:none;z-index:6}
.fab{pointer-events:auto;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem;height:56px;padding:0 22px;border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.fab span{font-size:1.5rem;line-height:1;font-weight:500}
.fabbar{gap:10px}
.fab.mic{width:56px;padding:0;justify-content:center}
.fab.mic svg{pointer-events:none}
.fab.mic.on{background:var(--danger,#C62828);animation:micpulse 1s ease-in-out infinite}
@keyframes micpulse{50%{transform:scale(1.08)}}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow:auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.open{transform:none}
.sheet{overscroll-behavior:contain}
.scrim{touch-action:none}
body:has(.sheet.open){overscroll-behavior-y:none}
@media (min-width:760px){
  .sheet{left:50%;right:auto;width:600px;bottom:auto;top:50%;border-radius:22px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .15s, transform .18s;max-height:88%;padding-bottom:22px}
  .sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
}
@media (prefers-reduced-motion:reduce){ .sheet{transition:none} }
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-family:var(--display);margin:0 0 12px;font-size:1.4rem;letter-spacing:-.02em}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.flabel{font-weight:700;font-size:.88rem;color:var(--muted)}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;min-height:44px}
.input:focus{border-color:var(--accent);outline:none}
.title-input{font-size:1.15rem;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbtn{text-align:left;font-weight:600;font-variant-numeric:tabular-nums}
.tbtn[aria-expanded="true"]{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:-1px}
.tpick{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;margin:-4px 0 14px;display:grid;gap:8px}
.tp-head{font-weight:700;font-size:.85rem;color:var(--muted)}
.tp-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.tp{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:40px;font-weight:600;font-variant-numeric:tabular-nums}
.tp[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.92rem}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dchip{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem}
.dchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:.82rem;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
/* Annulla/Aggiungi sempre visibili in fondo alla scheda, anche con la tastiera aperta */
.sheet-save{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));z-index:1;background:var(--surface);margin:6px -18px 0;padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;height:48px;padding:0 22px;border-radius:14px;flex:1}
.danger{border:1.5px solid #C0392B;color:#C0392B;background:transparent;font-weight:700;height:44px;padding:0 14px;border-radius:12px}
.secondary{border:1.5px solid var(--line);background:var(--surface);font-weight:600;height:48px;padding:0 18px;border-radius:14px}
.ptoggle{width:100%;display:flex;align-items:center;gap:10px;justify-content:space-between;text-align:left;border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 12px;color:var(--ink)}
.ptoggle .pchip{pointer-events:none}
.ptoggle-lbl{font-weight:700;font-size:.88rem;color:var(--accent);white-space:nowrap}
.pedit{margin-top:4px}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.swatches{display:flex;gap:6px;flex-wrap:wrap;grid-column:1 / -1}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.ver{position:fixed;left:10px;bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:25;font-size:.78rem;font-weight:600;color:var(--muted);pointer-events:none}
.login{margin:8vh auto 0}
.pwwrap{position:relative}.pwwrap .input{padding-right:48px}
.pweye{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.pweye svg{pointer-events:none}.pweye[aria-pressed="true"] .slash{display:none}
.err{color:#C0392B;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="row">
      <h1 class="brand">Famiglia</h1>
      <button class="icon-btn" id="btnPeople" aria-label="Gestisci famiglia">👥</button>
    </div>
    <div class="row">
      <button class="icon-btn" id="prev" aria-label="Periodo precedente">‹</button>
      <h2 class="period" id="period"></h2>
      <button class="icon-btn" id="next" aria-label="Periodo successivo">›</button>
      <button class="ghost" id="todayBtn">Oggi</button>
    </div>
    <div class="views" role="group" aria-label="Visualizzazione">
      <button data-view="agenda">Agenda</button>
      <button data-view="settimana">Settimana</button>
      <button data-view="mese">Mese</button>
      <button data-view="persone">Persone</button>
    </div>
    <div class="people-filter" id="filter" aria-label="Filtri"></div>
  </div>
</header>

<main id="main"><p class="hint">Caricamento…</p></main>

<div class="fabbar"><button class="fab mic" id="mic" aria-label="Nuovo impegno a voce" hidden><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button class="fab" id="fab"><span>+</span> Nuovo impegno</button></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status"></div>
<!-- VERSIONE: a ogni modifica aumentala insieme a CACHE in sw.js (stesso numero) -->
<div class="ver" aria-hidden="true">v17</div>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const wd = d => (d.getDay()+6)%7; // lun = 0
const weekStart = d => addDays(d, -wd(d));
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const DAYS = ['lun','mar','mer','gio','ven','sab','dom'];
const DAYS_LONG = ['lunedì','martedì','mercoledì','giovedì','venerdì','sabato','domenica'];
const MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const COLORS = ['#E4572E','#2F6FDB','#E0A100','#2E9E6B','#8A4FD3','#D6457E','#159A9C','#6B7785',
  '#B3261E','#F08A24','#7A9A01','#1E6F43','#1D4E9E','#3AA5DC','#8B5A3C','#B83DBA'];
const safeColor = c => /^#[0-9a-fA-F]{6}$/.test(c||'') ? c : '#6B7785';
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const TYPES = {
  partita:{label:'Partita', icon:'⚽'},
  allenamento:{label:'Allenamento', icon:'🏃'},
  scadenza:{label:'Scadenza', icon:'⏰'},
  scuola:{label:'Scuola', icon:'🎒'},
  salute:{label:'Visita', icon:'🩺'},
  altro:{label:'Altro', icon:'📌'}
};

const LS_PW = 'famcal-pw', LS_CACHE = 'famcal-cache-v1';
const store = { pw:'' };
let queue = Promise.resolve(), pending = 0, polling = false;

async function api(payload){
  let j;
  try{
    const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({...payload, password: store.pw}) });
    j = await r.json();
  }catch(err){ const e = new Error('unreachable'); e.code = navigator.onLine === false ? 'offline' : 'unreachable'; throw e; }
  if(!j.ok){ const e = new Error(j.error||'errore'); e.code = j.error; e.detail = j.detail; throw e; }
  return j;
}
function sortPeople(arr){ return arr.sort((a,b)=>(a.order||0)-(b.order||0) || String(a.name).localeCompare(b.name)); }
function cacheSave(){ try{ localStorage.setItem(LS_CACHE, JSON.stringify({people:S.people, events:S.events})); }catch(e){} }
function cacheLoad(){ try{ const d = JSON.parse(localStorage.getItem(LS_CACHE)||'{}'); S.people = sortPeople(d.people||[]); S.events = d.events||[]; }catch(e){} }
function applyData(j){ S.people = sortPeople(j.people||[]); S.events = j.events||[]; cacheSave(); }

async function sync(){
  if(!store.pw || pending) return;
  try{
    const j = await api({action:'list'});
    if(pending) return;
    applyData(j); S.mode = 'online'; render(); refreshSheet();
  }catch(e){
    if(e.code === 'wrong_password'){ logout('La password è cambiata: inseriscila di nuovo.'); return; }
    if(S.mode !== 'offline'){ S.mode = (S.people.length || S.events.length) ? 'offline' : 'error'; render(); }
  }
}
function startPolling(){
  if(polling) return; polling = true;

  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') sync(); });
  window.addEventListener('online', sync);
}
async function init(){
  try{ store.pw = localStorage.getItem(LS_PW) || ''; }catch(e){}
  pushLoad(); filterLoad();
  if(!/^https:\/\//.test(API_URL)){ S.mode = 'config'; render(); return; }
  if(!store.pw){ S.mode = 'login'; render(); return; }
  cacheLoad();
  if(S.people.length || S.events.length){ S.mode = 'offline'; render(); S.mode = 'online'; }
  await sync(); startPolling(); pushResume(); pushHint();
}
async function login(pw){
  pw = (pw||'').trim(); if(!pw) return;
  store.pw = pw; S.loginError = ''; S.mode = 'loading'; render();
  try{
    const j = await api({action:'list'});
    try{ localStorage.setItem(LS_PW, pw); }catch(e){}
    applyData(j); S.mode = 'online'; render(); startPolling(); pushResume(); pushHint();
  }catch(e){
    store.pw = ''; S.mode = 'login';
    S.loginError = ({
      wrong_password: 'Password non corretta.',
      offline: 'Il telefono è senza connessione. Collegati e riprova.',
      no_password: 'Sul server non è ancora impostata la password: in Apps Script esegui la funzione impostaPassword.',
      unreachable: 'Lo script Google non risponde correttamente: controlla che il deployment sia accessibile a “Chiunque” e che sia l’ultima versione.'
    })[e.code] || `Errore dello script Google (${e.code || 'sconosciuto'}). Riprova tra poco.`;
    render();
  }
}
function logout(msg){
  try{ localStorage.removeItem(LS_PW); localStorage.removeItem(LS_CACHE); localStorage.removeItem(LS_FILTER); }catch(e){}
  store.pw = ''; S.people = []; S.events = []; S.filter.clear(); S.hideTypes.clear(); S.mode = 'login'; S.loginError = msg || '';
  closeSheet(); render();
}
function writeFail(e){
  if(e && e.code === 'wrong_password'){ logout('La password è cambiata: inseriscila di nuovo.'); return; }
  toast('Modifica non salvata: controlla la connessione e riprova.');
}
function enqueue(payload){
  pending++;
  const p = queue.then(() => api(payload));
  queue = p.catch(()=>{}).finally(() => { pending--; if(!pending) sync(); });
  return p;
}
// Aggiorna subito lo schermo, poi salva sul foglio in background
function putDoc(coll, obj, extra){
  const arr = coll === 'people' ? S.people : S.events;
  const i = arr.findIndex(x => x.id === obj.id); if(i >= 0) arr[i] = obj; else arr.push(obj);
  if(coll === 'people') sortPeople(arr);

  enqueue(Object.assign({action:'put', coll, item: JSON.parse(JSON.stringify(obj))}, extra)).catch(writeFail);

function delDoc(coll, id){
  const arr = coll === 'people' ? S.people : S.events;
  const i = arr.findIndex(x => x.id === id); if(i >= 0) arr.splice(i, 1);
  cacheSave(); render(); refreshSheet();

// Es. "inserisci per Chiara visita oculistica al 16 novembre 2026 alle 15"
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI = ['domenica','luned[iì]','marted[iì]','mercoled[iì]','gioved[iì]','venerd[iì]','sabato'];
const TYPE_WORDS = [
  ['salute', /visit|medic|dottor|dentist|oculist|pediatr|analisi|vaccin|prelievo|ospedal|fisioterap|ortodont/i],
  ['partita', /partita|torneo|\bgara\b/i],
  ['allenamento', /allenament|palestra|piscina|nuoto|danza/i],
  ['scuola', /scuola|colloqui|recita|compit|verifica|interrogazion/i],
  ['scadenza', /scadenz|pagare|pagamento|bollett|\bbollo\b|rinnov|\btass[ae]\b|assicurazion/i]
];
const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const TM = '(\\d{1,2}|una)(?:[:.](\\d{2})|\\s+e\\s+(mezza|mezzo|un quarto|tre quarti|\\d{1,2}))?(?:\\s+(?:del|di|della)\\s+(mattina|mattino|pomeriggio|sera|notte))?';
function spokenMin(h, mm, extra, qual){
  h = h === 'una' ? 1 : +h;
  let m = mm ? +mm : extra ? ({mezza:30, mezzo:30, 'un quarto':15, 'tre quarti':45}[extra] ?? +extra) : 0;
  if(qual ? /pomeriggio|sera/.test(qual) && h < 12 : h >= 1 && h <= 6) h += 12;
  return Math.min(h*60 + Math.min(m,59), 23*60+59);
}
const minHM = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
function validDate(y, mo, d){ const x = new Date(y, mo, d); return x.getMonth() === mo && x.getDate() === d ? x : null; }

function parseSpoken(text){
  let t = ' ' + String(text).replace(/[,;]/g, ' ').replace(/\s+/g, ' ') + ' ';
  const cut = re => { let m = null; t = t.replace(re, (...a) => { m = a; return ' '; }); return m; };
  const out = {}, now = today();
  cut(/^\s*(?:inserisci|aggiungi|metti|segna|crea|ricordami(?: di)?|nuovo)(?:\s+(?:un|una|l'|il)?\s*(?:impegno|appuntamento|evento))?\s/i);
  if(cut(/\s(?:per\s)?tutt[oa] (?:il giorno|la giornata)\s/i)) out.allDay = true;
  // ora
  let m;
  if((m = cut(new RegExp(`\\s(?:dalle|dall')\\s*(?:ore\\s+)?${TM}\\s+(?:alle|fino alle)\\s+(?:ore\\s+)?${TM}\\s`, 'i')))){
    out.start = spokenMin(m[1],m[2],m[3],m[4]); out.end = spokenMin(m[5],m[6],m[7],m[8] || m[4]);
  } else if((m = cut(new RegExp(`\\s(?:alle|all'|ore|alle ore|verso le|per le)\\s*${TM}\\s`, 'i')))){
    out.start = spokenMin(m[1],m[2],m[3],m[4]);
  } else if(cut(/\s(?:a\s)?mezzogiorno\s/i)) out.start = 12*60;
  // giorno
  const pre = '(?:(?:il|al|per il|per|del|di|giorno|entro il)\\s+)?(?:(?:' + GIORNI.join('|') + ')\\s+)?';
  let date = null;
  if((m = cut(new RegExp(`\\s${pre}(\\d{1,2}|primo)(?:°|º)?\\s+(${MESI.join('|')})(?:\\s+(?:del\\s+)?(\\d{4}))?\\s`, 'i')))){
    const d = m[1].toLowerCase() === 'primo' ? 1 : +m[1], mo = MESI.indexOf(m[2].toLowerCase());
    date = validDate(m[3] ? +m[3] : now.getFullYear(), mo, d);
    if(date && !m[3] && date < now) date = validDate(now.getFullYear()+1, mo, d);
  } else if((m = cut(new RegExp(`\\s${pre}(\\d{1,2})[/.-](\\d{1,2})(?:[/.-](\\d{2,4}))?\\s`)))){
    let y = m[3] ? +m[3] : now.getFullYear(); if(y < 100) y += 2000;
    date = validDate(y, +m[2]-1, +m[1]);
    if(date && !m[3] && date < now) date = validDate(y+1, +m[2]-1, +m[1]);
  } else if((m = cut(/\s(?:per\s)?(oggi|stasera|domani|dopodomani)\s/i))){
    date = new Date(now); date.setDate(date.getDate() + ({oggi:0, stasera:0, domani:1, dopodomani:2}[m[1].toLowerCase()]));
  } else if((m = cut(new RegExp(`\\s(?:(?:il|di|per|questo|questa|prossimo)\\s+)?(${GIORNI.join('|')})(?:\\s+prossim[oa])?\\s`, 'i')))){
    const wd = GIORNI.findIndex(g => new RegExp(`^${g}$`, 'i').test(m[1]));
    date = new Date(now); date.setDate(date.getDate() + ((wd - now.getDay() + 6) % 7) + 1);
  } else if((m = cut(/\s(?:il|al|per il)\s+(\d{1,2})\s/i))){
    date = validDate(now.getFullYear(), now.getMonth(), +m[1]);
    if(date && date < now) date = validDate(now.getFullYear(), now.getMonth()+1, +m[1]);
  }
  if(date) out.date = iso(date);
  // chi
  if(cut(/\s(?:per\s)?(?:tutti|tutta la famiglia)\s/i)) out.who = [];
  else {
    const who = [];
    [...S.people].sort((a,b) => b.name.length - a.name.length).forEach(p => {
      const re = new RegExp(`\\s(?:(?:per|con|a|di|e)\\s+)?${reEsc(p.name.trim())}(?=\\s)`, 'i');
      if(p.name.trim() && cut(re)) who.push(p.id);
    });
    if(who.length) out.who = who;
  }
  // cosa: quello che resta
  let title = t.replace(/\s+/g, ' ').trim(), prev;
  do {
    prev = title;
    title = title.replace(/^(?:per|con|a|al|alla|allo|il|lo|la|di|del|della|e|ed|che|ore|alle)\s+/i, '')
                 .replace(/\s+(?:per|con|a|al|alla|il|lo|la|di|del|della|e|ed|alle|ore|il giorno)$/i, '').replace(/[.\s]+$/, '');
  } while(title !== prev);
  out.title = (title.charAt(0).toUpperCase() + title.slice(1)).slice(0, 80);
  const tp = TYPE_WORDS.find(([, re]) => re.test(text)); if(tp) out.type = tp[0];
  if(out.start != null){ const e = out.end != null && out.end > out.start ? out.end : Math.min(out.start + 60, 23*60+59); out.start = minHM(out.start); out.end = minHM(e); }
  else delete out.end;
  return out;
}

/* ---------- recurrence ---------- */
function occursOn(ev, d, ds){
  if(!ev.date || ds < ev.date) return false;
  if((ev.skip||[]).includes(ds)) return false;
  const r = ev.rep || {freq:'none'};
  if(!r.freq || r.freq === 'none') return ds === ev.date;
  if(r.until && ds > r.until) return false;
  const start = parse(ev.date);
  if(r.freq === 'weekly'){
    const days = (r.days && r.days.length) ? r.days : [wd(start)];
    if(!days.includes(wd(d))) return false;
    const weeks = Math.round((weekStart(d) - weekStart(start)) / 6048e5);
    return weeks % (r.interval||1) === 0;
  }
  if(r.freq === 'monthly') return d.getDate() === start.getDate();
  return false;
}
/* ---------- filtri (persone e tipi), salvati solo su questo dispositivo ---------- */
const LS_FILTER = 'famcal-filter';
function filterLoad(){
  try{ const f = JSON.parse(localStorage.getItem(LS_FILTER) || '{}'); S.filter = new Set(f.people || []); S.hideTypes = new Set((f.hide || []).filter(k => TYPES[k])); }catch(e){}
}
function filterSave(){ try{ localStorage.setItem(LS_FILTER, JSON.stringify({people:[...S.filter], hide:[...S.hideTypes]})); }catch(e){} }
// Le persone salvate nel filtro che non esistono più vengono ignorate
function filterPrune(){ const n = S.filter.size; S.filter.forEach(id => { if(!personOf(id)) S.filter.delete(id); }); if(S.filter.size !== n) filterSave(); }
function filterClear(){ S.filter.clear(); S.hideTypes.clear(); filterSave(); }
const filterActive = () => S.filter.size > 0 || S.hideTypes.size > 0;
const typeOf = ev => TYPES[ev.type] ? ev.type : 'altro';
const typeOk = ev => !S.hideTypes.has(typeOf(ev));
function visible(ev){
  if(!typeOk(ev)) return false;
  if(!S.filter.size) return true;
  const who = ev.who||[];
  return who.length === 0 || who.some(id => S.filter.has(id));   // "tutta la famiglia" resta sempre visibile
}
// Riassunto per il pulsante in alto ("Giulia, Tommy · senza 🏃") e per la riga sopra le liste
function filterSummary(long){
  const names = [...S.filter].map(personOf).filter(Boolean).map(p => p.name), hide = [...S.hideTypes];
  const parts = [];
  if(names.length) parts.push((long ? 'solo ' : '') + names.join(', '));
  if(hide.length) parts.push('senza ' + (long ? hide.map(k => TYPE_PLURAL[k]).join(', ') : hide.map(k => TYPES[k].icon).join(' ')));
  return parts.join(' · ');
}
function sortOcc(a,b){
  const ka = a.allDay ? '00' : (a.start||'99'), kb = b.allDay ? '00' : (b.start||'99');
  return ka.localeCompare(kb) || String(a.title).localeCompare(b.title);
}
function eventsOn(d, list){
  const ds = iso(d);
  return (list||S.events).filter(ev => visible(ev) && occursOn(ev, d, ds)).sort(sortOcc);
}

/* ---------- rendering helpers ---------- */
function personOf(id){ return S.people.find(p => p.id === id); }
function initial(n){ return esc((String(n||'?').trim()[0]||'?').toUpperCase()); }
function evColor(ev){ const p = (ev.who||[]).map(personOf).find(Boolean); return p ? safeColor(p.color) : 'var(--muted)'; }
function timeLabel(ev){
  if(ev.type === 'scadenza') return ev.allDay || !ev.start ? 'Scadenza' : `Scadenza ore ${ev.start}`;
  if(ev.allDay) return 'Tutto il giorno';
  return (ev.start||'') + (ev.end ? '–' + ev.end : '');
}
function repLabel(ev){
  const r = ev.rep||{};
  if(r.freq === 'weekly'){ const days = (r.days&&r.days.length?r.days:[wd(parse(ev.date))]).slice().sort().map(i=>DAYS[i]).join(', '); return (r.interval===2?'ogni 2 settimane: ':'ogni ') + days; }
  if(r.freq === 'monthly') return 'ogni mese';
  return '';
}
function relDays(ds){
  const n = Math.round((parse(ds) - today())/864e5);
  if(n === 0) return 'oggi'; if(n === 1) return 'domani'; if(n < 0) return 'passata';
  return `tra ${n} giorni`;
}
function evCard(ev, ds, opts={}){
  const t = TYPES[ev.type] || TYPES.altro;
  const ppl = (ev.who||[]).map(personOf).filter(Boolean);
  const who = opts.hideWho ? '' : (ppl.length ? ppl.map(p=>`<span class="who" style="--c:${safeColor(p.color)}"><i></i>${esc(p.name)}</span>`).join('') : '<span class="who">Tutta la famiglia</span>');
  const rep = repLabel(ev);
  let badge = '';
  if(ev.type === 'scadenza'){ const r = relDays(ds); const n = Math.round((parse(ds)-today())/864e5); badge = ` <span class="badge ${n>=0&&n<=3?'soon':''}">${r}</span>`; }
  return `<button class="ev ${ev.type==='scadenza'?'is-deadline':''}" style="--c:${evColor(ev)}" data-ev="${esc(ev.id)}" data-date="${ds}">
    <span class="ev-time">${esc(timeLabel(ev))}${badge}</span>
    <span class="ev-title">${t.icon} ${esc(ev.title)}</span>
    <span class="ev-meta">${who}${ev.place?`<span>📍 ${esc(ev.place)}</span>`:''}${rep?`<span class="rep">🔁 ${esc(rep)}</span>`:''}${ev.notify&&ev.notify.before&&ev.notify.before.length?'<span>🔔</span>':''}</span>
  </button>`;
}

/* ---------- views ---------- */
function setPeriod(){
  const a = S.anchor; let txt = '';
  if(S.view === 'settimana'){
    const s = weekStart(a), e = addDays(s,6);
    txt = s.getMonth()===e.getMonth() ? `${s.getDate()}–${e.getDate()} ${MONTHS[e.getMonth()]} ${e.getFullYear()}` : `${s.getDate()} ${MONTHS[s.getMonth()].slice(0,3)} – ${e.getDate()} ${MONTHS[e.getMonth()].slice(0,3)} ${e.getFullYear()}`;
  } else if(S.view === 'mese'){ txt = `${cap(MONTHS[a.getMonth()])} ${a.getFullYear()}`; }
  else { const e = addDays(a, S.view==='agenda'?59:27); txt = `${a.getDate()} ${MONTHS[a.getMonth()].slice(0,3)} – ${e.getDate()} ${MONTHS[e.getMonth()].slice(0,3)}`; }
  $('#period').textContent = txt;
}
function renderFilter(){
  const on = filterActive();
  $('#filter').innerHTML = `<button class="fbtn ${on?'on':''}" id="filterBtn" aria-label="Filtri${on ? ': ' + esc(filterSummary(true)) : ''}"><svg class="fic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg><span class="ftxt">${on ? esc(filterSummary(false)) : 'Filtri'}</span></button>`
    + (on ? `<button class="fclear" id="filterClear" aria-label="Azzera filtri">✕</button>` : '');
  $('#filter').style.display = S.mode === 'online' || S.mode === 'offline' ? '' : 'none';
}
function render(){
  document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === S.view));
  const ready = S.mode === 'online' || S.mode === 'offline';
  $('#fab').style.display = ready ? '' : 'none';
  $('#mic').hidden = !(ready && SR && S.canWrite);
  $('header .bar').style.display = (S.mode === 'login' || S.mode === 'config') ? 'none' : '';
  if(ready) filterPrune();
  renderFilter(); setPeriod();
  const m = $('#main');
  if(S.mode === 'loading'){ m.innerHTML = '<p class="hint">Caricamento…</p>'; return; }
  if(S.mode === 'config'){ m.innerHTML = `<section class="empty"><h2>Manca un passaggio</h2><p>Apri il file index.html e incolla l’indirizzo dello script Google nella riga API_URL. Trovi le istruzioni nel file LEGGIMI.</p></section>`; return; }
  if(S.mode === 'login'){
    m.innerHTML = `<section class="empty login"><h2>Calendario di famiglia</h2><p>Inserisci la password di famiglia. Su questo dispositivo te la chiederà una volta sola.</p>
      <div class="pwwrap"><input class="input" id="loginPw" type="password" autocomplete="current-password" placeholder="Password">
      <button type="button" class="pweye" id="pwToggle" aria-label="Mostra password" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button></div>
      ${S.loginError ? `<p class="err">${esc(S.loginError)}</p>` : ''}
      <button class="primary" id="loginBtn">Entra</button></section>`;
    setTimeout(()=>$('#loginPw')?.focus(), 30); return;
  }
  if(S.mode === 'error'){ m.innerHTML = `<section class="empty"><h2>Nessuna connessione</h2><p>Non riesco a scaricare il calendario. Controlla la connessione: riprovo da solo appena torna.</p><button class="secondary" id="retryBtn">Riprova ora</button></section>`; return; }
  let html = '';
  if(S.mode === 'offline') html += `<div class="notice">Senza connessione: stai vedendo l’ultima versione scaricata.</div>`;
  if(filterActive() && S.people.length) html += `<div class="fnote">Filtri attivi: ${esc(filterSummary(true))} — <button class="linkbtn" id="filterReset">Mostra tutto</button></div>`;
  if(!S.people.length && S.canWrite){
    html += `<section class="empty"><h2>Chi c’è in famiglia?</h2><p>Aggiungi le persone una alla volta: ognuna avrà il suo colore, così a colpo d’occhio capisci di chi è ogni impegno.</p>
      <div class="row"><input class="input" id="quickPerson" autocomplete="off" placeholder="Nome, es. Luca" style="flex:1" maxlength="30"><button class="primary" id="quickPersonAdd" style="flex:0">Aggiungi</button></div></section>`;
    m.innerHTML = html; return;
  }
  if(S.view === 'settimana') html += viewWeek();
  else if(S.view === 'mese') html += viewMonth();
  else if(S.view === 'agenda') html += viewAgenda();
  else html += viewPeople();
  m.innerHTML = html;
}
// Quadratino di un giorno (settimana e mese); toccandolo si vedono sotto solo i suoi impegni
function dayCell(d, out){
  const ds = iso(d), evs = eventsOn(d);
  return `<button class="mcell ${out?'out':''} ${ds===iso(today())?'is-today':''} ${ds===S.day?'sel':''}" data-day="${ds}" aria-pressed="${ds===S.day}" aria-label="${d.getDate()} ${MONTHS[d.getMonth()]}, ${evs.length} impegni">
    <span class="mnum">${d.getDate()}</span>
    ${evs.slice(0,3).map(e=>`<span class="mev ${e.type==='scadenza'?'is-deadline':''}" style="--c:${evColor(e)}">${e.allDay||!e.start?'':esc(e.start)+' '}${esc(e.title)}</span>`).join('')}
    ${evs.length>3?`<span class="more">+${evs.length-3} altri</span>`:''}
    <span class="dots">${evs.slice(0,5).map(e=>`<i style="--c:${evColor(e)}"></i>`).join('')}</span>
  </button>`;
}
// Impegni a cascata, raggruppati per giorno
function dayGroups(days, evsOf, opts={}){
  const t = iso(today()); let h = '', lastM = -1, n = 0;
  for(const d of days){
    const ds = iso(d), evs = evsOf(d, ds);
    if(!evs.length) continue; n++;
    if(opts.months && d.getMonth() !== lastM){ lastM = d.getMonth(); h += `<div class="amonth">${cap(MONTHS[lastM])}</div>`; }
    h += `<section class="aday ${ds===t?'is-today':''}"><div class="adate"><span class="day-num">${d.getDate()}</span><small>${DAYS[wd(d)]}</small></div><div class="alist">${evs.map(e=>evCard(e,ds,opts.card&&opts.card(e))).join('')}</div></section>`;
  }
  return { html: h, n };
}
// Sotto la griglia: tutto il periodo (pulsante preselezionato) oppure solo il giorno toccato
function periodList(days, label, emptyTxt){
  let h = `<div class="scope"><button class="pchip all" data-scope aria-pressed="${!S.day}">${label}</button>`;
  if(S.day){
    const d = parse(S.day), evs = eventsOn(d);
    h += `<h3>${cap(DAYS_LONG[wd(d)])} ${d.getDate()} ${MONTHS[d.getMonth()]}</h3></div><div class="agenda plist">
      ${evs.length ? `<div class="alist">${evs.map(e=>evCard(e,S.day)).join('')}</div>` : '<span class="empty-day">Nessun impegno</span>'}
      ${S.canWrite?`<button class="secondary add-day" data-add="${S.day}">+ Aggiungi in questo giorno</button>`:''}</div>`;
  } else {
    const g = dayGroups(days, d => eventsOn(d));
    h += `</div><div class="agenda plist">${g.html || `<span class="empty-day">${emptyTxt}${filterActive()?' con i filtri attivi':''}</span>`}</div>`;
  }
  return h;
}
function viewWeek(){
  const s = weekStart(S.anchor), days = [...Array(7)].map((_,i)=>addDays(s,i));
  return `<div class="dow">${DAYS.map(d=>`<span>${d}</span>`).join('')}</div><div class="month wgrid">${days.map(d=>dayCell(d)).join('')}</div>`
    + periodList(days, 'Settimana', 'Nessun impegno questa settimana');
}
function viewMonth(){
  const a = S.anchor, first = new Date(a.getFullYear(), a.getMonth(), 1), start = weekStart(first);
  let h = `<div class="dow">${DAYS.map(d=>`<span>${d}</span>`).join('')}</div><div class="month">`;
  for(let i=0;i<42;i++){
    const d = addDays(start,i); if(i===35 && d.getMonth()!==a.getMonth()) break;
    h += dayCell(d, d.getMonth()!==a.getMonth());
  }
  const days = [...Array(new Date(a.getFullYear(), a.getMonth()+1, 0).getDate())].map((_,i)=>new Date(a.getFullYear(), a.getMonth(), i+1));
  return h + '</div>' + periodList(days, 'Mese', 'Nessun impegno questo mese');
}
function viewAgenda(){
  const t = iso(today()); let h = '<div class="agenda">', any = false, lastM = -1;
  for(let i=0;i<60;i++){
    const d = addDays(S.anchor,i), ds = iso(d), evs = eventsOn(d);
    if(!evs.length) continue; any = true;
    if(d.getMonth() !== lastM){ lastM = d.getMonth(); h += `<div class="amonth">${cap(MONTHS[lastM])}</div>`; }
    h += `<section class="aday ${ds===t?'is-today':''}"><div class="adate"><span class="day-num">${d.getDate()}</span><small>${DAYS[wd(d)]}</small></div><div class="alist">${evs.map(e=>evCard(e,ds)).join('')}</div></section>`;
  }
  if(!any) h += `<div class="empty"><h2>Niente in vista</h2><p>Nei prossimi 60 giorni non ci sono impegni${filterActive()?' con i filtri attivi':''}. Tocca “Nuovo impegno” per aggiungerne uno.</p></div>`;
  return h + '</div>';
}
function viewPeople(){
  const shown = S.filter.size ? S.people.filter(p=>S.filter.has(p.id)) : S.people;
  if(!shown.some(p=>p.id===S.person)) S.person = shown[0] ? shown[0].id : null;
  const days = [...Array(28)].map((_,i)=>addDays(S.anchor,i));
  const mineOf = id => S.events.filter(e => typeOk(e) && (!(e.who||[]).length || (e.who||[]).includes(id)));
  let h = '<div class="pcards">', sel = null;
  for(const p of shown){
    const mine = mineOf(p.id), n = days.reduce((k,d)=>k + mine.filter(e=>occursOn(e,d,iso(d))).length, 0);
    if(p.id === S.person) sel = p;
    h += `<button class="pcard" style="--c:${safeColor(p.color)}" data-person="${esc(p.id)}" aria-pressed="${p.id===S.person}">
      <b><span class="pchip" style="--c:${safeColor(p.color)};padding:0;border:0;background:none"><span class="dot">${initial(p.name)}</span></span>${esc(p.name)}</b>
      <small>${n ? `${n} impegn${n===1?'o':'i'}` : 'Nessun impegno'}</small></button>`;
  }
  h += '</div>';
  if(sel){
    const mine = mineOf(sel.id);
    const g = dayGroups(days, (d, ds) => mine.filter(e=>occursOn(e,d,ds)).sort(sortOcc), { months:true, card: e => ({hideWho:(e.who||[]).length===1}) });
    h += `<div class="scope"><h3>Impegni di ${esc(sel.name)}</h3></div><div class="agenda plist">${g.html || '<span class="empty-day">Nessun impegno nelle prossime 4 settimane</span>'}</div>`;
  }
  return h;
}

/* ---------- sheet ---------- */
let draft = null, draftOcc = null, sheetKind = null, saving = false;
function openSheet(kind){ sheetKind = kind; $('#scrim').classList.add('open'); $('#sheet').classList.add('open'); setTimeout(()=>{ const f = $('#sheet [data-autofocus]'); if(f && kind==='event' && !draft.id && !draft.title) f.focus(); }, 60); }
function closeSheet(){ if(sheetKind === 'hint' && $('#hintNever')?.checked){ try{ localStorage.setItem(LS_HINT, '1'); }catch(e){} }
  $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open'); sheetKind = null; draft = null; }
function refreshSheet(){ if(sheetKind === 'people') renderPeopleSheet(); if(sheetKind === 'filter') renderFilterSheet(); }

function openEditor(id, occ, pre){
  const base = id ? S.events.find(e=>e.id===id) : null;
  if(id && !base) return;
  const d = occ || S.day || iso(today());
  draft = base ? JSON.parse(JSON.stringify(base)) : Object.assign({
    id:null, title:'', type:'altro', who: S.filter.size===1 ? [...S.filter] : [], date:d, allDay:false,
    start:'17:00', end:'18:00', rep:{freq:'none', days:[], interval:1, until:''}, skip:[], place:'', notes:''
  }, pre || {});
  draft.rep = Object.assign({freq:'none',days:[],interval:1,until:''}, draft.rep||{});
  draftOcc = occ || draft.date; timePick = null; draftAnnounce = false;
  renderEditor(); openSheet('event');
}
// Selettore dell'ora dentro la scheda (quello di sistema su alcuni telefoni esce dallo schermo)
let timePick = null;
function timePicker(){
  const v = draft[timePick] || (timePick === 'end' ? draft.start : '') || '17:00', [h, m] = v.split(':').map(Number);
  const cell = (attr, n, on) => `<button type="button" class="tp" ${attr}="${n}" aria-pressed="${on}">${pad(n)}</button>`;
  return `<div class="tpick"><div class="tp-head">${timePick==='start' ? (draft.type==='scadenza'?'Entro le':'Ora di inizio') : 'Ora di fine'}</div>
    <div class="tp-grid">${[...Array(24)].map((_,i)=>cell('data-th', i, i===h)).join('')}</div>
    <div class="tp-head">Minuti</div>
    <div class="tp-grid">${[...Array(12)].map((_,i)=>cell('data-tm', i*5, i*5===m)).join('')}</div>
    <div class="actions">${timePick==='end' ? '<button type="button" class="secondary" data-tnone>Senza ora di fine</button>' : ''}<button type="button" class="secondary" data-tdone style="flex:1">Fatto</button></div></div>`;
}
const toMin = t => { const [h, m] = t.split(':').map(Number); return h*60 + m; };
function setTime(k, t){
  if(k === 'start' && draft.end && draft.start){
    const dur = toMin(draft.end) - toMin(draft.start);
    if(dur > 0) draft.end = minHM(Math.min(toMin(t) + dur, 23*60+59));
  }
  draft[k] = t;
  if(k === 'start' && (!draft.end || toMin(draft.end) <= toMin(t))) draft.end = minHM(Math.min(toMin(t) + 60, 23*60+59));
}

  ${ro ? `<div class="actions"><button class="secondary" data-close style="flex:1">Chiudi</button></div>` : `
  <div class="actions sheet-save"><button class="secondary" data-close>Annulla</button><button class="primary" id="saveEv">${e.id?'Salva modifiche':'Aggiungi al calendario'}</button></div>
  ${e.id ? `<div class="actions" style="margin-top:14px">${recurring ? `<button class="danger" id="delOne">Elimina solo ${occD.getDate()} ${MONTHS[occD.getMonth()].slice(0,3)}</button><button class="danger" id="delAll">Elimina tutta la serie</button>` : `<button class="danger" id="delAll">Elimina impegno</button>`}</div>`:''}`}`;
}
function applyTypePreset(k){
  draft.type = k;
  if(draft.id) return;
  if(k === 'allenamento'){ draft.rep.freq = 'weekly'; draft.rep.interval = 1; if(!draft.rep.days.length) draft.rep.days = [wd(parse(draft.date))]; }
  if(k === 'scadenza'){ draft.allDay = true; draft.rep.freq = 'none'; }
  if(k === 'partita'){ draft.allDay = false; draft.rep.freq = 'none'; }
}
async function saveEvent(){
  if(saving) return;
  const e = draft;
  e.title = (e.title||'').trim();
  if(!e.title){ toast('Scrivi cosa c’è in programma.'); $('#f-title')?.focus(); return; }
  if(!e.date){ toast('Scegli il giorno.'); return; }
  if(e.rep.freq === 'weekly' && !e.rep.days.length) e.rep.days = [wd(parse(e.date))];
  if(e.rep.freq === 'none'){ e.rep = {freq:'none', days:[], interval:1, until:''}; }
  if(!e.allDay && e.start && e.end && e.end < e.start) e.end = '';
  const isNew = !e.id; if(isNew) e.id = newId('e');
  // senza promemoria tengo solo i destinatari, se serve per "Avvisa subito"
  if(e.notify && !(e.notify.before && e.notify.before.length)){ if(draftAnnounce) e.notify = {before:[], to:e.notify.to}; else delete e.notify; }
  const ann = draftAnnounce ? {announce: isNew ? 'new' : 'edit', from: push.token || undefined} : undefined;
  saving = true;
  closeSheet();
  if(isNew && (S.view==='mese'||S.view==='settimana')){ S.anchor = parse(e.date); if(S.day && S.day !== e.date) S.day = null; }
  putDoc('events', e, ann); saving = false;
  toast(!visible(e) ? 'Salvato, ma è nascosto dai filtri.' : isNew ? 'Impegno aggiunto' : 'Modifiche salvate');
}
async function deleteOne(){
  const base = S.events.find(x=>x.id===draft.id); if(!base) return;
  const upd = JSON.parse(JSON.stringify(base)); upd.skip = [...new Set([...(upd.skip||[]), draftOcc])];
  try{ await putDoc('events', upd); closeSheet(); toast('Annullato solo per quel giorno'); }catch(err){ writeFail(err); }
}
async function deleteAll(){
  if(!confirm('Eliminare questo impegno' + (draft.rep.freq!=='none'?' e tutte le sue ripetizioni':'') + '?')) return;
  try{ await delDoc('events', draft.id); closeSheet(); toast('Impegno eliminato'); }catch(err){ writeFail(err); }
}

/* people sheet */
function renderFilterSheet(){
  $('#sheet').innerHTML = `<div class="grab"></div><h2 id="sheetTitle">Filtri</h2>
  <div class="field"><span class="flabel">Mostra solo</span>
    <div class="chips"><button class="pchip all" data-fperson="" aria-pressed="${S.filter.size===0}">Tutti</button>${S.people.map(p => `<button class="pchip" style="--c:${safeColor(p.color)}" data-fperson="${esc(p.id)}" aria-pressed="${S.filter.has(p.id)}"><span class="dot">${initial(p.name)}</span>${esc(p.name)}</button>`).join('')}</div>
    <span class="hint">Gli impegni di tutta la famiglia restano sempre visibili.</span></div>
  <div class="field"><span class="flabel">Nascondi</span>
    <div class="tswitches">${Object.entries(TYPES).map(([k,t]) => `<label class="switch tsw"><input type="checkbox" data-ftype="${k}" ${S.hideTypes.has(k)?'':'checked'}> ${t.icon} ${esc(TYPE_PLURAL[k])}</label>`).join('')}</div>
    <span class="hint">Spegni un tipo per nascondere quegli impegni.</span></div>
  <p class="hint">I filtri valgono solo su questo dispositivo.</p>
  <div class="actions"><button class="secondary" id="filterAll" ${filterActive()?'':'disabled'}>Azzera filtri</button><button class="primary" data-close style="flex:1">Fatto</button></div>`;
}
let peopleOpen = false;   // elenco persone da modificare: chiuso di base
function renderPeopleSheet(){
  const ro = !S.canWrite;
  $('#sheet').innerHTML = `<div class="grab"></div><h2 id="sheetTitle">Famiglia</h2>
  <button class="ptoggle" id="peopleToggle" aria-expanded="${peopleOpen}">
    <span class="chips">${S.people.map(p=>`<span class="pchip" style="--c:${safeColor(p.color)}"><span class="dot">${initial(p.name)}</span>${esc(p.name)}</span>`).join('') || '<span class="hint">Nessuno ancora</span>'}</span>
    <span class="ptoggle-lbl">${peopleOpen ? 'Chiudi ▴' : (ro ? 'Dettagli ▾' : 'Modifica ▾')}</span>
  </button>
  ${!peopleOpen ? '' : `<div class="pedit">${S.people.map(p=>`<div class="prow" data-pid="${esc(p.id)}">
    <input class="input" data-pname="${esc(p.id)}" autocomplete="off" value="${esc(p.name)}" maxlength="30" aria-label="Nome" ${ro?'disabled':''}>
    ${ro?'':`<button class="danger" data-pdel="${esc(p.id)}" aria-label="Rimuovi ${esc(p.name)}">Rimuovi</button>`}
    <div class="swatches">${COLORS.map(c=>`<button class="sw" style="--c:${c}" data-pcolor="${c}" data-for="${esc(p.id)}" aria-label="Colore" aria-pressed="${safeColor(p.color)===c}" ${ro?'disabled':''}></button>`).join('')}</div>
  </div>`).join('') || '<p class="hint">Nessuno ancora.</p>'}
  ${ro?'':`<div class="row" style="margin-top:14px"><input class="input" id="newPerson" autocomplete="off" placeholder="Aggiungi una persona" maxlength="30" style="flex:1"><button class="primary" id="addPerson" style="flex:0">Aggiungi</button></div>`}</div>`}
  ${ro ? '' : pushSection()}
  <p class="hint" style="margin-top:16px">Per condividere il calendario manda ai familiari l’indirizzo di questa pagina e la password. Sul telefono, dal menu del browser scegli “Installa app” o “Aggiungi a schermata Home”.</p>
  <button class="secondary" id="copyLink" style="width:100%;margin-top:10px">🔗 Copia il link da condividere</button>
  <div class="actions"><button class="secondary" id="logoutBtn">Esci da questo dispositivo</button><button class="secondary" data-close style="flex:1">Fatto</button></div>`;
}
async function addPerson(name){
  name = (name||'').trim(); if(!name) return;
  const used = S.people.map(p=>p.color);
  const color = COLORS.find(c=>!used.includes(c)) || COLORS[S.people.length % COLORS.length];
  const order = S.people.reduce((m,p)=>Math.max(m,p.order||0),0) + 1;
  try{ await putDoc('people', {id:newId('p'), name, color, order}); toast(`${name} aggiunto`); }catch(err){ writeFail(err); }
}
async function updatePerson(id, patch){
  const p = S.people.find(x=>x.id===id); if(!p) return;
  try{ await putDoc('people', {...p, ...patch}); }catch(err){ writeFail(err); }
}
async function removePerson(id){
  const p = S.people.find(x=>x.id===id); if(!p) return;
  if(!confirm(`Rimuovere ${p.name}? I suoi impegni restano, ma senza il suo nome.`)) return;
  try{ await delDoc('people', id); S.filter.delete(id); filterSave(); }catch(err){ writeFail(err); }
}

/* ---------- events ---------- */
let toastT;
// Indirizzo dell'app senza la vista (#settimana ecc.)
async function copyLink(){
  const url = location.origin + location.pathname;
  try{ await navigator.clipboard.writeText(url); }
  catch(err){
    const i = document.createElement('textarea'); i.value = url; i.setAttribute('readonly',''); i.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(i); i.select(); const ok = document.execCommand('copy'); i.remove();
    if(!ok){ prompt('Copia questo link:', url); return; }
  }
  toast('Link copiato: incollalo in un messaggio ai familiari.');
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600); }

document.querySelectorAll('.views button').forEach(b => b.addEventListener('click', () => {
  S.view = b.dataset.view; S.day = null;
  if(S.view === 'agenda' || S.view === 'persone') S.anchor = today();
  try{ history.replaceState(null,'','#'+S.view); }catch(e){}
  render();
}));
function shift(dir){
  const a = S.anchor; S.day = null;
  if(S.view === 'settimana') S.anchor = addDays(a, 7*dir);
  else if(S.view === 'mese'){ S.anchor = new Date(a.getFullYear(), a.getMonth()+dir, 1); }
  else S.anchor = addDays(a, (S.view==='agenda'?28:14)*dir);
  render();
}
$('#prev').onclick = () => shift(-1);
$('#next').onclick = () => shift(1);
$('#todayBtn').onclick = () => { S.anchor = today(); S.day = null; render(); };
$('#fab').onclick = () => openEditor(null, null);
$('#mic').onclick = voiceStart;
$('#btnPeople').onclick = () => { pushSel = new Set(push.persons); peopleOpen = !S.people.length; renderPeopleSheet(); openSheet('people'); };
$('#scrim').onclick = closeSheet;
document.addEventListener('keydown', e => { if(e.key === 'Escape' && sheetKind) closeSheet(); });

$('#filter').addEventListener('click', e => {
  if(e.target.closest('#filterClear')){ filterClear(); render(); return; }
  if(e.target.closest('#filterBtn')){ renderFilterSheet(); openSheet('filter'); }
});
function scrollToList(){ const p = document.querySelector('.scope'); if(p && p.getBoundingClientRect().top > window.innerHeight - 160) p.scrollIntoView({behavior:'smooth', block:'start'}); }
$('#main').addEventListener('click', e => {
  const ev = e.target.closest('[data-ev]'); if(ev){ openEditor(ev.dataset.ev, ev.dataset.date); return; }
  const add = e.target.closest('[data-add]'); if(add){ openEditor(null, add.dataset.add); return; }
  const day = e.target.closest('[data-day]'); if(day){ S.day = S.day === day.dataset.day ? null : day.dataset.day; render(); scrollToList(); return; }
  if(e.target.closest('[data-scope]')){ S.day = null; render(); return; }
  const per = e.target.closest('[data-person]'); if(per){ S.person = per.dataset.person; render(); scrollToList(); return; }
  if(e.target.id === 'quickPersonAdd'){ const i = $('#quickPerson'); addPerson(i.value); }
  if(e.target.id === 'loginBtn'){ login($('#loginPw').value); }
  if(e.target.id === 'pwToggle'){ const i = $('#loginPw'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; e.target.setAttribute('aria-pressed', show); e.target.setAttribute('aria-label', show ? 'Nascondi password' : 'Mostra password'); i.focus(); }
  if(e.target.id === 'retryBtn'){ sync(); }
  if(e.target.id === 'filterReset'){ filterClear(); render(); }
});
$('#main').addEventListener('keydown', e => {
  if(e.target.id === 'quickPerson' && e.key === 'Enter') addPerson(e.target.value);
  if(e.target.id === 'loginPw' && e.key === 'Enter') login(e.target.value);
});

const sheet = $('#sheet');
// Trascinando verso il basso (con la scheda in cima) la scheda si chiude, invece di aggiornare la pagina
let drag = null;
sheet.addEventListener('touchstart', e => { drag = sheetKind && sheet.scrollTop <= 0 ? { y: e.touches[0].clientY, x: e.touches[0].clientX, dy: 0, t: Date.now(), on: false } : null; }, { passive: true });
sheet.addEventListener('touchmove', e => {
  if(!drag) return;
  const dy = e.touches[0].clientY - drag.y, dx = e.touches[0].clientX - drag.x;
  if(!drag.on){
    if(dy < 8 || Math.abs(dx) > dy || sheet.scrollTop > 0){ if(dy < -4 || Math.abs(dx) > 8) drag = null; return; }
    drag.on = true; sheet.style.transition = 'none';
  }
  e.preventDefault();
  drag.dy = Math.max(0, dy); sheet.style.transform = `translateY(${drag.dy}px)`;
}, { passive: false });
sheet.addEventListener('touchend', () => {
  if(!drag || !drag.on){ drag = null; return; }
  const fast = drag.dy > 40 && drag.dy / (Date.now() - drag.t) > 0.5;
  sheet.style.transition = ''; sheet.style.transform = '';
  if(drag.dy > 110 || fast) closeSheet();
  drag = null;
});
sheet.addEventListener('input', e => {
  if(sheetKind !== 'event' || !draft) return;
  const k = e.target.dataset.k, r = e.target.dataset.rep;
  if(k){ draft[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; if(k==='allDay') renderEditor(); }
  if(r){ draft.rep[r] = e.target.value; }
});
sheet.addEventListener('change', e => {
  if(sheetKind === 'filter' && e.target.dataset.ftype){ const k = e.target.dataset.ftype; e.target.checked ? S.hideTypes.delete(k) : S.hideTypes.add(k); filterSave(); render(); renderFilterSheet(); return; }
  if(sheetKind === 'event' && e.target.id === 'f-announce'){ draftAnnounce = e.target.checked; renderEditor(); return; }
  if(sheetKind === 'event' && e.target.id === 'f-rep'){
    const v = e.target.value;
    if(v === 'none') draft.rep.freq = 'none';
    else if(v === 'monthly') draft.rep.freq = 'monthly';
    else { draft.rep.freq = 'weekly'; draft.rep.interval = v==='biweekly'?2:1; if(!draft.rep.days.length) draft.rep.days = [wd(parse(draft.date||iso(today())))]; }
    renderEditor();
  }
  if(sheetKind === 'people' && e.target.dataset.pname){ const v = e.target.value.trim(); if(v) updatePerson(e.target.dataset.pname, {name:v}); }
});
sheet.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.hasAttribute('data-close')){ closeSheet(); return; }
  if(sheetKind === 'event'){
    if(t.dataset.type){ applyTypePreset(t.dataset.type); renderEditor(); return; }
    if(t.dataset.who){ const id = t.dataset.who, w = new Set(draft.who||[]); w.has(id)?w.delete(id):w.add(id); draft.who = [...w]; t.setAttribute('aria-pressed', w.has(id));
      if(draft.notify && !Array.isArray(draft.notify.to)) renderEditor();   // "A chi" segue "Chi"
      return; }
    if(t.dataset.nbefore !== undefined){ const m = +t.dataset.nbefore, b = new Set(draft.notify.before); b.has(m)?b.delete(m):b.add(m); draft.notify.before = [...b].sort((x,y)=>x-y); renderEditor(); return; }
    if(t.dataset.nto !== undefined){
      const n = draft.notify, id = t.dataset.nto;
      if(!id) n.to = []; else { const c = new Set(Array.isArray(n.to) ? n.to : (draft.who||[])); c.has(id)?c.delete(id):c.add(id); n.to = [...c]; }
      renderEditor(); return;
    }
    if(t.dataset.dayToggle !== undefined){ const i = +t.dataset.dayToggle, s = new Set(draft.rep.days||[]); s.has(i)?s.delete(i):s.add(i); draft.rep.days = [...s].sort(); t.setAttribute('aria-pressed', s.has(i)); return; }
    if(t.dataset.tpick){ timePick = timePick === t.dataset.tpick ? null : t.dataset.tpick; renderEditor(); return; }
    if(t.dataset.th || t.dataset.tm){
      const cur = (draft[timePick] || (timePick === 'end' ? draft.start : '') || '17:00').split(':');
      setTime(timePick, t.dataset.th ? `${pad(+t.dataset.th)}:${cur[1]}` : `${cur[0]}:${pad(+t.dataset.tm)}`);
      if(t.dataset.tm) timePick = timePick === 'start' && draft.type !== 'scadenza' ? 'end' : null;  // scelti i minuti: passa alla fine, poi chiude
      renderEditor(); return;
    }
    if(t.hasAttribute('data-tnone')){ draft.end = ''; timePick = null; renderEditor(); return; }
    if(t.hasAttribute('data-tdone')){ timePick = null; renderEditor(); return; }
    if(t.id === 'saveEv') saveEvent();
    if(t.id === 'delOne') deleteOne();
    if(t.id === 'delAll') deleteAll();
  }
  if(sheetKind === 'filter'){
    if(t.dataset.fperson !== undefined){ const id = t.dataset.fperson; if(!id) S.filter.clear(); else if(S.filter.has(id)) S.filter.delete(id); else S.filter.add(id); filterSave(); render(); renderFilterSheet(); return; }
    if(t.id === 'filterAll'){ filterClear(); render(); renderFilterSheet(); return; }
  }
  if(sheetKind === 'hint' && t.id === 'hintGo'){ closeSheet(); $('#btnPeople').onclick(); setTimeout(()=>$('.pushbox')?.scrollIntoView({behavior:'smooth', block:'start'}), 250); return; }
  if(sheetKind === 'people'){
    if(t.id === 'peopleToggle'){ peopleOpen = !peopleOpen; renderPeopleSheet(); return; }
    if(t.id === 'copyLink'){ copyLink(); return; }
    if(t.dataset.pushp){ const id = t.dataset.pushp; pushSel.has(id) ? pushSel.delete(id) : pushSel.add(id); t.setAttribute('aria-pressed', pushSel.has(id)); if(push.token) pushPersons(); return; }
    if(t.id === 'pushOn'){ pushEnable(); return; }
    if(t.id === 'pushOff'){ pushDisable(); return; }
    if(t.id === 'pushTest'){ pushTest(); return; }
    if(t.id === 'addPerson'){ const i = $('#newPerson'); addPerson(i.value); i.value = ''; return; }
    if(t.dataset.pdel){ removePerson(t.dataset.pdel); return; }
    if(t.dataset.pcolor){ updatePerson(t.dataset.for, {color:t.dataset.pcolor}); return; }
    if(t.id === 'logoutBtn'){ if(confirm('Uscire? Su questo dispositivo dovrai reinserire la password.')) logout(); return; }
  }
});
sheet.addEventListener('keydown', e => {
  if(sheetKind === 'people' && e.target.id === 'newPerson' && e.key === 'Enter'){ addPerson(e.target.value); e.target.value = ''; }
  if(sheetKind === 'event' && e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox'){ e.preventDefault(); saveEvent(); }
});

render();
init();
if('serviceWorker' in navigator && location.protocol === 'https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
